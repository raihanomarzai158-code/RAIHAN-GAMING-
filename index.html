<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAIHAN GAMING</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1120; color: white; text-align: center; }
        header { background-color: #111827; padding: 25px 15px; border-bottom: 2px solid #1e293b; }
        header h1 { color: #38bdf8; font-size: 28px; letter-spacing: 1px; }
        header p { color: #94a3b8; font-size: 15px; margin-top: 8px; }
        .search-container { margin: 20px auto; max-width: 500px; padding: 0 15px; }
        .search-container input { width: 100%; padding: 14px 20px; border-radius: 12px; border: 2px solid #38bdf8; background-color: #1e293b; color: white; font-size: 16px; outline: none; }
        .section-title { text-align: left; max-width: 900px; margin: 20px auto 15px; padding: 0 20px; font-size: 22px; color: #38bdf8; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 18px; max-width: 900px; margin: 0 auto 40px; padding: 0 15px; }
        .game-card { background-color: #1e293b; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 16px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 15px; }
        .game-card img { width: 100%; height: 130px; object-fit: cover; }
        .game-card h3 { font-size: 17px; margin: 12px 10px; color: #f8fafc; }
        .play-btn { display: inline-block; background-color: #38bdf8; color: #0f172a; font-weight: bold; text-decoration: none; padding: 10px 28px; border-radius: 25px; margin: 0 auto; font-size: 14px; transition: 0.2s; }
        .play-btn:hover { background-color: #0284c7; color: white; }
        footer { padding: 20px; color: #64748b; font-size: 14px; border-top: 1px solid #1e293b; }
    </style>
</head>
<body>

<header>
    <h1>🎮 RAIHAN GAMING</h1>
    <p>Play & Download Your Favorite Mobile Games</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" onkeyup="searchGames()" placeholder="🔍 Search Games...">
</div>

<h2 class="section-title">🔥 Popular Games</h2>

<div class="games-grid">
    <!-- 1. Subway Surfers (اول ګېم) -->
    <div class="game-card">
        <img src="https://unsplash.com" alt="Subway Surfers">
        <h3>Subway Surfers</h3>
        <a href="https://google.com" target="_blank" class="play-btn">PLAY</a>
    </div>

    <!-- 2. Car Racing -->
    <div class="game-card">
        <img src="https://unsplash.com" alt="Car Racing">
        <h3>Asphalt Racing</h3>
        <a href="https://google.com" target="_blank" class="play-btn">PLAY</a>
    </div>

    <!-- 3. Football -->
    <div class="game-card">
        <img src="https://unsplash.com" alt="Football">
        <h3>FC Mobile Football</h3>
        <a href="https://google.com" target="_blank" class="play-btn">PLAY</a>
    </div>

    <!-- 4. PUBG Mobile -->
    <div class="game-card">
        <img src="https://unsplash.com" alt="PUBG Mobile">
        <h3>PUBG Mobile</h3>
        <a href="https://google.com" target="_blank" class="play-btn">PLAY</a>
    </div>

    <!-- 5. Free Fire -->
    <div class="game-card">
        <img src="https://unsplash.com" alt="Free Fire">
        <h3>Garena Free Fire</h3>
        <a href="https://google.com" target="_blank" class="play-btn">PLAY</a>
    </div>

    <!-- 6. Clash of Clans -->
    <div class="game-card">
        <img src="https://unsplash.com" alt="Clash of Clans">
        <h3>Clash of Clans</h3>
        <a href="https://google.com" target="_blank" class="play-btn">PLAY</a>
    </div>
</div>

<footer>
    © 2026 RAIHAN GAMING - All Rights Reserved
</footer>

<script>
function searchGames() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let cards = document.querySelectorAll(".game-card");
    cards.forEach(card => {
        let title = card.querySelector("h3").innerText.toLowerCase();
        card.style.display = title.includes(input) ? "flex" : "none";
    });
}
</script>

</body>
</html>
