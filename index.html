
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAIHAN GAMING</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#080d19;
color:white;
font-family:Arial,sans-serif;
}
header{
background:#111c33;
padding:22px 10px;
text-align:center;
border-bottom:2px solid #00d9ff;
}
header h1{color:#00d9ff;margin:0}
header p{color:#bbb}
input{
width:90%;
padding:13px;
margin:15px 5%;
border-radius:12px;
border:1px solid #00d9ff;
background:#17243c;
color:white;
}
h2{padding:0 15px;color:#00d9ff}
.games{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
padding:12px;
}
.game{
background:#15233a;
border-radius:14px;
overflow:hidden;
text-align:center;
padding-bottom:15px;
}
.game img{
width:100%;
height:120px;
object-fit:cover;
}
.game h3{margin:12px 3px}
.game button{
background:#00c8ff;
border:0;
padding:10px 24px;
border-radius:20px;
font-weight:bold;
}
footer{
text-align:center;
padding:25px;
color:#aaa;
}
</style>
</head>
<body>

<header>
<h1>🎮 RAIHAN GAMING</h1>
<p>Play Your Favorite Online Games</p>
</header>

<input type="text" id="search"
placeholder="🔍 Search Games..."
oninput="searchGames()">

<h2>🔥 Popular Games</h2>

<div class="games" id="games">

<div class="game">
<img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=500" alt="Racing car">
<h3>Car Racing</h3>
<button onclick="alert('Game coming soon!')">PLAY</button>
</div>

<div class="game">
<img src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=500" alt="Football">
<h3>Football</h3>
<button onclick="alert('Game coming soon!')">PLAY</button>
</div>

<div class="game">
<img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500" alt="Gaming">
<h3>Action Games</h3>
<button onclick="alert('Game coming soon!')">PLAY</buttos
</div>

<div class="game">
<img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500" alt="Arcade">
<h3>Arcade Games</h3>
<a href="https://google.com" target="_blank"><button>PLAY</button></a>
  
</div>

</div>

<footer>© 2026 RAIHAN GAMING</footer>

<script>
function searchGames(){
let value=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".game").forEach(game=>{
game.style.display=game.innerText.toLowerCase().includes(value)?"block":"none";
});
}
</script>

</body>
</html>
